# Publica o site do seminário (pasta site/) no GitHub Pages.
# Para ativar: Settings → Pages → Source: "GitHub Actions".
name: Publish seminar site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Tenta habilitar o Pages (fonte: GitHub Actions) na primeira execução.
          # Se o token não tiver permissão, habilite em Settings → Pages e rode de novo.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
